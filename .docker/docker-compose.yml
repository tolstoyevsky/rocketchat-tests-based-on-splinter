version: '2'
services:
  rocketchat-tests:
    image: rocketchat-tests
    environment:
    - ADDR=${ADDR}
    - BRANCH=${BRANCH}
    - USERNAME=${USERNAME}
    - PASSWORD=${PASSWORD}
    - WAIT=${WAIT}
    - PYTHON=${PYTHON}
    - SCRIPTS=${SCRIPTS}
    - PUGS_LIMIT=${PUGS_LIMIT}
    network_mode: "host"